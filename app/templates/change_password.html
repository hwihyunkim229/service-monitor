<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>초기 비밀번호 변경 · CART Service</title>
    <link rel="stylesheet" href="/static/style.css?v=20260917-2">
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <section class="auth-brand">
        <span class="brand-symbol">S</span>
        <div>
          <span>SECURITY CHECK</span>
          <h1>
            계정을 안전하게
            <br>
            시작하세요.
          </h1>
          <p>처음 로그인한 계정은 비밀번호를 변경한 뒤 서비스를 이용할 수 있습니다.</p>
        </div>
      </section>
      <section class="auth-form">
        <div>
          <span class="auth-eyebrow">PASSWORD UPDATE</span>
          <h2>초기 비밀번호 변경</h2>
          <p>새 비밀번호를 설정하면 다시 로그인해 주세요.</p>
        </div>
        {% if error %}
          <div class="auth-alert" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="/change-password">
          <label for="new-password">
            새 비밀번호
            <input id="new-password"
                   type="password"
                   name="password"
                   placeholder="8자 이상 입력"
                   autocomplete="new-password"
                   minlength="8"
                   required>
          </label>
          <label for="new-password-confirm">
            새 비밀번호 확인
            <input id="new-password-confirm"
                   type="password"
                   name="password_confirm"
                   placeholder="동일한 비밀번호를 다시 입력"
                   autocomplete="new-password"
                   minlength="8"
                   required>
          </label>
          <button type="submit">비밀번호 변경 후 재로그인</button>
        </form>
        <small class="auth-help">비밀번호는 8자 이상으로 설정해 주세요.</small>
      </section>
    </main>
  </body>
</html>
